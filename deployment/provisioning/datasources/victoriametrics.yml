apiVersion: 1

datasources:
    - name: VictoriaMetrics
      type: prometheus
      access: proxy
      url: http://vmstack:8427/metrics/select/prometheus/
      isDefault: true
      jsonData:
        prometheusType: Prometheus
        prometheusVersion: 2.24.0
        httpHeaderName1: AccountID
        httpHeaderName2: ProjectID
      secureJsonData:
        httpHeaderValue1: 0
        httpHeaderValue2: 0