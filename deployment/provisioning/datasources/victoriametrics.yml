apiVersion: 1

datasources:
    - name: VictoriaMetrics
      type: prometheus
      access: proxy
      url: http://vmstack:8427/metrics/select/prometheus/
      isDefault: true
      # is needed to link correlation from VictoriaTraces datasource
      uid: "victoriametrics-prometheus-ds"
      correlations:
        - targetUID: "victorialogs-ds"
          label: "See logs for service"
          description: "See logs for service"
          type: "query"
          config:
            field: "service.name"
            target:
              expr: '{service.name="$${__data.fields["service.name"]}"}'
              queryType: "instant"
              range: true
              editorMode: "code"
              legendFormat: "__auto"
      jsonData:
        prometheusType: Prometheus
        prometheusVersion: 2.24.0
        httpHeaderName1: AccountID
        httpHeaderName2: ProjectID
      secureJsonData:
        httpHeaderValue1: 0
        httpHeaderValue2: 0