receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: "victoriametrics"
          static_configs:
            - targets: [ "victoriametics:8428" ]
        - job_name: "victorialogs"
          static_configs:
            - targets: [ "victorialogs:9428" ]
        - job_name: "victoriatraces"
          static_configs:
            - targets: [ "victoriatraces:10428" ]

processors:
  batch:

exporters:
  otlp_http/vm-metrics: { metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics }
  otlp_http/vm-logs: { logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs }
  otlp_http/vm-traces: { traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces }

service:
  pipelines:
    logs: { receivers: [ otlp ], processors: [ batch ], exporters: [ otlp_http/vm-logs ] }
    traces: { receivers: [ otlp ], processors: [ batch ], exporters: [ otlp_http/vm-traces ] }
    metrics: { receivers: [ prometheus ], processors: [ batch ], exporters: [ otlp_http/vm-metrics ] }
