receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: "victoriametrics"
          static_configs:
            - targets: [ "victoriametics:8428" ]
        - job_name: "victorialogs"
          static_configs:
            - targets: [ "victorialogs:9428" ]
        - job_name: "victoriatraces"
          static_configs:
            - targets: [ "victoriatraces:10428" ]

processors:
  batch:

exporters:
  # Single-node VictoriaMetrics installation doesn't support multi-tenancy, so we omit it for all destinations.
  otlp_http/vm-metrics: { metrics_endpoint: http://vmstack:8427/metrics/insert/opentelemetry/v1/metrics }
  otlp_http/vm-logs:    { logs_endpoint: http://vmstack:8427/logs/insert/opentelemetry/v1/logs }
  otlp_http/vm-traces:  { traces_endpoint: http://vmstack:8427/traces/insert/opentelemetry/v1/traces }

service:
  pipelines:
    logs: { receivers: [ otlp ], processors: [ batch ], exporters: [ otlp_http/vm-logs ] }
    traces: { receivers: [ otlp ], processors: [ batch ], exporters: [ otlp_http/vm-traces ] }
    metrics: { receivers: [ prometheus ], processors: [ batch ], exporters: [ otlp_http/vm-metrics ] }
