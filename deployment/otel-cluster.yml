services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes: [ "./config/otelcollector/config.yml:/etc/otelcol/config.yml" ]

# VictoriaMetrics cluster definition

  # vmstorage shards. Each shard receives 1/N of all samples, where N is number of vmstorages (2 in this case).
  vmstorage-1:
    image: victoriametrics/vmstorage:v1.150.0-cluster
    volumes: [ "vmdata-1:/storage" ]
  vmstorage-2:
    image: victoriametrics/vmstorage:v1.150.0-cluster
    volumes: [ "vmdata-2:/storage" ]

  # vminsert is an ingestion frontend. It receives metrics pushed by OTEL collector,
  # and distributes them across configured vmstorage shards.
  vminsert-1:
    image: victoriametrics/vminsert:v1.150.0-cluster
    command:
      - "--storageNode=vmstorage-1:8400"
      - "--storageNode=vmstorage-2:8400"
  vminsert-2:
    image: victoriametrics/vminsert:v1.150.0-cluster
    command:
      - "--storageNode=vmstorage-1:8400"
      - "--storageNode=vmstorage-2:8400"

  # vmselect is a query fronted. It serves read queries by fetching data from configured `--storageNode` shards.
  vmselect-1:
    image: victoriametrics/vmselect:v1.150.0-cluster
    command:
      - "--storageNode=vmstorage-1:8401"
      - "--storageNode=vmstorage-2:8401"
      - "--vmalert.proxyURL=http://rules-metrics:8880"
  vmselect-2:
    image: victoriametrics/vmselect:v1.150.0-cluster
    command:
      - "--storageNode=vmstorage-1:8401"
      - "--storageNode=vmstorage-2:8401"
      - "--vmalert.proxyURL=http://rules-metrics:8880"

# VictoriaLogs cluster definition

  # vlstorage shards. Each shard receives 1/N of all log entries, where N is number of vlstorage (2 in this case).
  vlstorage-1:
    image: victoriametrics/victoria-logs:v1.52.0
    command: [ "--storageDataPath=/vlogs" ]
    volumes: [ "vldata-1:/vlogs" ]
  vlstorage-2:
    image: victoriametrics/victoria-logs:v1.52.0
    command: [ "--storageDataPath=/vlogs" ]
    volumes: [ "vldata-2:/vlogs" ]

  vlinsert-1:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - "--storageNode=vlstorage-1:9428"
      - "--storageNode=vlstorage-2:9428"
  vlinsert-2:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - "--storageNode=vlstorage-1:9428"
      - "--storageNode=vlstorage-2:9428"

  vlselect-1:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - "--storageNode=vlstorage-1:9428"
      - "--storageNode=vlstorage-2:9428"
  vlselect-2:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - "--storageNode=vlstorage-1:9428"
      - "--storageNode=vlstorage-2:9428"


# VictoriaTraces cluster definition

  # vtstorage shards. Each shard receives 1/N of all log entries, where N is number of vlstorage (2 in this case).
  vtstorage-1:
    image: victoriametrics/victoria-traces:v0.11.0
    command: [ "--storageDataPath=/vtraces" ]
    volumes: [ "vtdata-1:/vtraces" ]
  vtstorage-2:
    image: victoriametrics/victoria-traces:v0.11.0
    command: [ "--storageDataPath=/vtraces" ]
    volumes: [ "vtdata-2:/vtraces" ]

  vtinsert-1:
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - "--storageNode=vtstorage-1:10428"
      - "--storageNode=vtstorage-2:10428"
  vtinsert-2:
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - "--storageNode=vtstorage-1:10428"
      - "--storageNode=vtstorage-2:10428"

  vtselect-1:
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - "--storageNode=vtstorage-1:10428"
      - "--storageNode=vtstorage-2:10428"
  vtselect-2:
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - "--storageNode=vtstorage-1:10428"
      - "--storageNode=vtstorage-2:10428"

  grafana:
    image: grafana/grafana:latest
    ports: [ "3000:3000" ]
    environment:
      # Install VictoriaLogs datasource plugin
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      # VictoriaMetrics is using native Prometheus datasource.
      # VictoriaTraces is using native Jaeger datasource.
    volumes:
      - grafanadata:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./provisioning/dashboards/demo.json:/var/lib/grafana/dashboards/demo.json

  # Entry point into VictoriaStack: authorizes and routes requests to VictoriaMetrics, VictoriaTraces, and VictoriaLogs.
  vmstack:
    image: victoriametrics/vmauth:latest
    volumes: [ "./config/vmauth/cluster.yml:/etc/auth.yml" ]
    command: [ "--auth.config=/etc/auth.yml" ]
    ports: [ "8427:8427" ]

  rules-metrics:
    image: victoriametrics/vmalert:v1.150.0
    command:
      - "-datasource.url=http://vmstack:8427/metrics/select/prometheus"
      # persist as metrics to VictoriaMetrics tenant 0 - see https://docs.victoriametrics.com/victoriametrics/vmalert/#multitenancy
      - "-remoteWrite.url=http://vmstack:8427/metrics/insert/0/prometheus"
      - "-rule=/etc/vmalert/alerts-demo.yml"
      # Replace "-notifier.blackhole" with actual "-notifier.url=<alertmanager_url>" for sending alerts
      - "-notifier.blackhole"
    volumes: [ "./rules:/etc/vmalert" ]

  rules-logs:
    image: victoriametrics/vmalert:v1.150.0
    command:
      # run rules against VictoriaLogs datasource
      - "-datasource.url=http://vmstack:8427/logs/"
      # persist as metrics to VictoriaMetrics tenant 0 - see https://docs.victoriametrics.com/victorialogs/vmalert/#how-to-use-multitenancy-in-rules
      - "-remoteWrite.url=http://vmstack:8427/metrics/insert/0/prometheus"
      - "-rule=/etc/vmalert/logs-to-metrics.yml"
    volumes: [ "./rules:/etc/vmalert" ]

volumes: {
  vmdata-1: { }, vmdata-2: { },
  vldata-1: { }, vldata-2: { },
  vtdata-1: { }, vtdata-2: { },
  grafanadata: { }
}